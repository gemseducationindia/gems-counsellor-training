<style>
/* Layout follows the CEO's sample sheet: Fees table, Transport table, Facilities table, then curriculum. Print = A4 landscape, 2 pages. */
:root {
  --brand: #751e2e; --brand-deep: #5f1825;
  --bg: #f6f5f4; --surface: #ffffff; --ink: #1f1a1b; --muted: #5f5658;
  --line: #e1dbdc; --tint: #f4ebed; --on-brand: #ffffff;
  --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body: "Figtree", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #161314; --surface: #201c1d; --ink: #f1ecec; --muted: #b3a9ab; --line: #3a3334; --tint: #2d2224; color-scheme: dark; } }
:root[data-theme="dark"] { --bg: #161314; --surface: #201c1d; --ink: #f1ecec; --muted: #b3a9ab; --line: #3a3334; --tint: #2d2224; color-scheme: dark; }
[data-brand="GSE"] { --brand: #1b2a5c; --brand-deep: #16224b; --tint: #e9ecf4; }
[data-brand="GMA"], [data-brand="LG"] { --brand: #a07c2c; --brand-deep: #836524; --tint: #f5efe2; }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 17px/1.5 var(--body); }
h1, h2, h3 { font-family: var(--display); text-wrap: balance; margin: 0; line-height: 1.15; }
.wrap { max-width: 1360px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
a { color: inherit; }
:focus-visible { outline: 3px solid var(--brand); outline-offset: 2px; }

.topbar { background: var(--surface); border-bottom: 1px solid var(--line); }
.topbar .wrap { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 14px; }
.wordmark { font-family: var(--display); font-weight: 700; font-size: 19px; text-decoration: none; }
.wordmark { display: inline-flex; align-items: center; gap: 12px; }
.wordmark img { height: 24px; width: auto; display: block; }
.wordmark span { color: var(--muted); font-weight: 500; padding-left: 12px; border-left: 1px solid var(--line); }
.back { font-size: 16px; color: var(--muted); text-decoration: none; }
.back:hover { color: var(--ink); }

/* Home */
.home-hero .wrap { padding-block: 28px 12px; display: grid; gap: 10px; }
.home-hero h1 { font-size: clamp(30px, 4vw, 42px); }
.home-hero p { margin: 0; color: var(--muted); max-width: 62ch; }
.brand-group { padding-block: 12px 8px; min-width: 0; }
.pair { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 0 24px; }
.pair .cards { grid-template-columns: repeat(auto-fill, minmax(min(100%, 150px), 1fr)); }
.pair .card b { font-size: 18px; }
.brand-group h2 { font-size: 14px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-family: var(--body); font-weight: 600; margin-bottom: 10px; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 170px), 1fr)); gap: 12px; }
.card { display: grid; gap: 2px; padding: 12px 16px 12px 20px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; text-decoration: none; position: relative; overflow: hidden; }
.card::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 5px; background: var(--brand); }
.card b { font-family: var(--display); font-size: 20px; }
.card small { color: var(--muted); font-size: 15px; }
.card .state { font-size: 14px; font-weight: 600; color: var(--brand); }
.card[aria-disabled="true"] { opacity: .6; pointer-events: none; }
.card[aria-disabled="true"] .state { color: var(--muted); }
a.card:hover { border-color: var(--brand); }

/* Campus header band */
.band { background: var(--brand); color: var(--on-brand); }
.band .wrap { padding-block: 28px; display: grid; grid-template-columns: 1fr auto; gap: 16px 24px; align-items: end; }
.eyebrow { font-size: 13px; letter-spacing: .1em; text-transform: uppercase; opacity: .85; font-weight: 600; }
.band h1 { font-size: clamp(30px, 4.4vw, 46px); margin-top: 4px; }
.facts { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 8px; }
.fact { border: 1px solid rgba(255,255,255,.4); border-radius: 999px; padding: 5px 14px; font-size: 15px; }
.fact b { font-weight: 700; }
.dl { display: inline-flex; align-items: center; gap: 8px; background: var(--on-brand); color: var(--brand-deep); font-weight: 700; padding: 13px 20px; border-radius: 8px; text-decoration: none; white-space: nowrap; font-size: 17px; }
.dl:hover { filter: brightness(.95); }
.dl svg { width: 20px; height: 20px; }

/* Sheet */
.sheet .wrap { padding-block: 24px 48px; display: grid; gap: 22px; }
.alert { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: baseline; background: var(--tint); border: 1px solid var(--line); border-radius: 10px; padding: 12px 18px; font-weight: 600; font-size: 17px; }
.printonly { display: none; }
.rest { display: grid; gap: 22px; min-width: 0; }
.alert strong { color: var(--brand); text-transform: uppercase; letter-spacing: .05em; font-size: 14px; }
.alert span + span::before { content: "•"; margin-right: 14px; color: var(--brand); }
.sec { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 20px 22px; display: grid; gap: 12px; align-content: start; min-width: 0; }
.sec h2 { font-size: 23px; color: var(--brand); }
.sec h3 { font-size: 17px; font-family: var(--body); font-weight: 700; }
.note { font-size: 14px; color: var(--muted); margin: 0; }
.row2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 22px; }
.scroll { overflow-x: auto; }

table { width: 100%; border-collapse: collapse; font-size: 16px; }
th, td { text-align: left; padding: 9px 10px; border: 1px solid var(--line); vertical-align: middle; }
thead th { background: var(--brand); color: var(--on-brand); font-size: 14px; font-weight: 700; line-height: 1.25; border-color: var(--brand); vertical-align: bottom; }
tbody th { font-weight: 700; white-space: nowrap; }
tbody tr:nth-child(even) td, tbody tr:nth-child(even) th { background: var(--tint); }
.c { text-align: center; }
.r { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.total { font-weight: 700; color: var(--brand); }
.fees td.r, .fees td.c { white-space: nowrap; }
.fees { font-size: 15px; }
.fees th, .fees td { padding: 8px 6px; }
.fees thead th { font-size: 13px; }
.fees td { white-space: nowrap; }
.fees td.time, .fees td.ex { white-space: normal; }
/* Below laptop width the fees table turns into one card per grade, so nothing scrolls sideways. */
@media screen and (max-width: 1180px) {
  .fees thead { display: none; }
  .fees, .fees tbody { display: block; }
  .fees tbody { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
  .fees tr { display: block; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--surface); }
  .fees tbody tr:nth-child(even) td { background: transparent; }
  .fees tbody th { display: block; background: var(--brand) !important; color: var(--on-brand); font-size: 18px; border: 0; padding: 9px 14px; }
  .fees td { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; border: 0; border-top: 1px solid var(--line); padding: 7px 14px; text-align: right; white-space: normal !important; }
  .fees td::before { content: attr(data-label); color: var(--muted); font-size: 15px; text-align: left; font-weight: 400; }
  .fees td.total { background: var(--tint) !important; }
}
.kv tbody th { width: 55%; }
.fac td { line-height: 1.9; }
.chip { display: inline-block; font-size: 15px; padding: 1px 10px; margin: 2px 4px 2px 0; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); line-height: 1.6; }
.cur td:first-child { white-space: nowrap; font-weight: 700; color: var(--brand); }
.cur td:nth-child(2) { color: var(--muted); }
.sec h2 small.count { font-family: var(--body); font-size: 14px; color: var(--muted); font-weight: 500; margin-left: 8px; }
.row2.tight { gap: 0 22px; }
.det tbody th { width: 38%; white-space: normal; color: var(--muted); font-weight: 600; }
.det td { white-space: normal; overflow-wrap: anywhere; }
.det tbody tr:nth-child(even) td, .det tbody tr:nth-child(even) th { background: transparent; }
.note.strong { color: var(--ink); font-weight: 600; }
.routes td { white-space: normal; }
.routes .nw { white-space: nowrap; }
.awards { margin: 0; padding-left: 20px; display: grid; gap: 4px; }
.foot { font-size: 14px; color: var(--muted); text-align: center; }

/* Home map */
.explorer { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 28px; align-items: start; padding-block: 8px; }
.mapbox { position: relative; overflow: hidden; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px; }
#india { width: 100%; height: auto; display: block; max-height: 78vh; --zoom: 1; overflow: hidden; }
#india .india { fill: var(--tint); stroke: var(--brand); stroke-width: calc(1.6px / var(--zoom)); stroke-linejoin: round; stroke-dasharray: 1; stroke-dashoffset: 0; animation: draw 1.6s ease-out both, fillin 1.6s ease-out both; }
@keyframes draw { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
@keyframes fillin { 0%, 45% { fill-opacity: 0; } 100% { fill-opacity: 1; } }
.pin { cursor: pointer; outline: none; animation: drop .5s cubic-bezier(.2, 1.4, .4, 1) both; animation-delay: var(--d); }
@keyframes drop { from { opacity: 0; translate: 0 -24px; } to { opacity: 1; translate: 0 0; } }
.pin .pi { transform: scale(calc(1 / var(--zoom))); }
.pin .dot { fill: var(--brand); stroke: var(--surface); stroke-width: 4; transform-box: fill-box; transform-origin: center; transition: transform .2s; }
.pin .pulse { fill: var(--brand); opacity: .25; transform-box: fill-box; transform-origin: center; animation: pulse 2.4s ease-out infinite; animation-delay: calc(var(--d) + .5s); }
@keyframes pulse { 0% { transform: scale(1); opacity: .35; } 100% { transform: scale(2.8); opacity: 0; } }
.pin text { font: 700 30px var(--body); fill: var(--ink); paint-order: stroke; stroke: var(--surface); stroke-width: 7px; stroke-linejoin: round; }
.pin:hover .dot, .pin.hover .dot, .pin:focus-visible .dot, .pin.on .dot { transform: scale(1.45); }
.pin:focus-visible text { text-decoration: underline; }
#india.focus .pin:not(.on) { opacity: .35; }
.citypanel { position: absolute; left: 12px; right: 12px; bottom: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; box-shadow: 0 10px 30px rgba(0,0,0,.12); display: grid; gap: 10px; animation: rise .35s ease-out both; }
@keyframes rise { from { opacity: 0; translate: 0 12px; } to { opacity: 1; translate: 0 0; } }
.cp-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.cp-head b { font-family: var(--display); font-size: 22px; }
.linkbtn { background: none; border: 0; padding: 0; color: var(--muted); font: inherit; font-size: 15px; text-decoration: underline; cursor: pointer; }
.cp-list { display: grid; gap: 8px; }
.cp-item { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 10px; background: var(--brand); color: var(--on-brand); text-decoration: none; font-size: 18px; }
.cp-item small { display: block; font-size: 14px; opacity: .85; }
.cp-item:hover { filter: brightness(1.1); }
.lists { display: grid; gap: 4px; min-width: 0; }
.lists .card { transition: opacity .3s, transform .2s; }
.lists .card.dim { opacity: .35; }
.lists .card:hover { transform: translateY(-2px); }
@media screen and (max-width: 900px) { .explorer { grid-template-columns: 1fr; } #india { max-height: 62vh; } }
@media (prefers-reduced-motion: reduce) { #india .india, .pin, .pin .pulse, .citypanel { animation: none; } .lists .card { transition: none; } }

@media screen and (max-width: 820px) {
  .routes .nw { white-space: normal; }
  .routes th, .routes td { padding: 7px 6px; font-size: 15px; }
  .routes td { overflow-wrap: anywhere; }
  .row2 { grid-template-columns: 1fr; }
  .band .wrap { grid-template-columns: 1fr; }
}

/* Print / PDF: A4 landscape, 2 pages, always light */
@page { size: A4 landscape; margin: 9mm 10mm; }
@media print {
  :root { --bg: #fff; --surface: #fff; --ink: #161213; --muted: #4f4749; --line: #cfc7c8; color-scheme: light; }
  [data-brand="GMS"] { --tint: #f6eef0; }
  * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  body { font-size: 12.5px; line-height: 1.35; }
  .topbar, .dl, .noprint { display: none !important; }
  .printonly { display: flex; }
  .sec.feesec { break-inside: auto; }
  .rest { display: block; column-count: 2; column-gap: 16px; break-before: page; font-size: 11px; }
  .rest > .sec, .rest > .row2 > .sec { display: block; break-inside: avoid; margin-bottom: 9px; }
  .rest > .sec > * + *, .rest > .row2 > .sec > * + * { margin-top: 4px; }
  .rest > .row2 { display: block; }
  .rest table { font-size: 11px; }
  .rest .chip { font-size: 10.5px; }
  .rest .row2.tight { display: block; }
  .rest .sec h2 { font-size: 14px; }
  .fees.dense { font-size: 12.5px; }
  .fees.dense th, .fees.dense td { padding: 3.5px 5px; }
  .fees.xdense { font-size: 11px; }
  .fees.xdense th, .fees.xdense td { padding: 1px 5px; line-height: 1.25; }
  .rest.bare { display: none; }
  .fees.xdense thead th, .fees.dense thead th { padding-block: 4px; }
  .det th, .det td { padding: 3px 6px; }
  .awards { gap: 1px; font-size: 11.5px; }
  .row2.tight { gap: 0 14px; }
  .wrap { max-width: none; padding: 0 !important; }
  .band { border-radius: 6px; }
  .band .wrap { padding: 10px 16px !important; gap: 6px 16px; }
  .band h1 { font-size: 26px; }
  .eyebrow { font-size: 10px; }
  .fact { font-size: 11.5px; padding: 2px 10px; }
  .sheet .wrap { padding-block: 8px 0 !important; gap: 8px; }
  .alert { padding: 6px 12px; font-size: 12.5px; border-radius: 6px; }
  .alert strong { font-size: 11px; }
  .sec { padding: 0; border: 0; gap: 5px; break-inside: avoid; }
  .sec h2 { font-size: 16px; }
  .sec h3 { font-size: 13px; }
  table { font-size: 12.5px; }
  th, td { padding: 4px 7px; }
  thead th { font-size: 11.5px; }
  .chip { font-size: 12px; padding: 0 8px; margin: 1px 3px 1px 0; line-height: 1.5; }
  .fac td { line-height: 1.6; }
  .note { font-size: 11px; }
  .row2 { gap: 14px; }
  .page2 { break-before: page; }
  .scroll { overflow: visible; }
  .fees { font-size: 13px; }
  .fees th, .fees td { padding: 6.5px 5px; }
  .fees thead th { font-size: 11.5px; }
  .fees td.time, .fees td.ex { white-space: nowrap; }
  .foot { font-size: 10px; }
}
</style>
</head>

const FULL_VIEW = [-40, -10, INDIA.w + 80, INDIA.h + 20];
let mapView = FULL_VIEW.slice(), mapAnim = 0;
const reduceMotion = () => matchMedia("(prefers-reduced-motion: reduce)").matches;

function setView(svg, target) {
  cancelAnimationFrame(mapAnim);
  const from = mapView.slice(), t0 = performance.now(), dur = reduceMotion() ? 0 : 700;
  const ease = t => 1 - Math.pow(1 - t, 3);
  const step = now => {
    const k = dur ? Math.min(1, (now - t0) / dur) : 1, e = ease(k);
    mapView = from.map((v, i) => v + (target[i] - v) * e);
    svg.setAttribute("viewBox", mapView.join(" "));
    svg.style.setProperty("--zoom", (FULL_VIEW[2] / mapView[2]).toFixed(3));
    if (k < 1) mapAnim = requestAnimationFrame(step);
  };
  mapAnim = requestAnimationFrame(step);
}

function home() {
  document.documentElement.removeAttribute("data-brand");
  document.title = "GEMS Campus Fact Files";
  document.getElementById("back").hidden = true;
  const bySlug = Object.fromEntries(CAMPUSES.map(c => [c.slug, c]));
  const card = c => `<a class="card" data-brand="${c.brand}" data-slug="${c.slug}" href="#${c.slug}"><b>${esc(c.short)}</b><small>${esc(c.city)}</small><span class="state">Open fact file</span></a>`;
  const group = b => {
    const list = CAMPUSES.filter(c => c.brand === b && c.live);
    return list.length ? `<section class="brand-group" data-brand="${b}"><h2>${BRANDS[b]}</h2><div class="cards">${list.map(card).join("")}</div></section>` : "";
  };
  const pins = CITIES.map((city, n) => {
    const [x, y] = INDIA.pins[city.pin];
    const lx = city.side === "left" ? -20 : city.side === "right" ? 20 : 0, ly = city.side === "top" ? -22 : 10;
    const anchor = city.side === "left" ? "end" : city.side === "right" ? "start" : "middle";
    return `<g class="pin" data-city="${city.id}" transform="translate(${x} ${y})" style="--d:${0.9 + n * 0.09}s" tabindex="0" role="button" aria-label="${city.name}: ${city.slugs.length} campus${city.slugs.length > 1 ? "es" : ""}">
      <g class="pi"><circle class="pulse" r="13"></circle><circle class="dot" r="11"></circle>
      <text x="${lx}" y="${ly}" text-anchor="${anchor}">${city.name}</text></g></g>`;
  }).join("");

  app.innerHTML = `<section class="home-hero"><div class="wrap"><h1>Campus Fact Files</h1>
    <p>Pick a city on the map, or a school from the list, to see its fees, transport, facilities and admissions. Each campus has a printable PDF.</p></div></section>
  <section class="wrap explorer">
    <div class="mapbox">
      <svg id="india" viewBox="${FULL_VIEW.join(" ")}" role="img" aria-label="Map of India showing GEMS campuses">
        <path class="india" d="${INDIA.d}" pathLength="1"></path>
        ${pins}
      </svg>
      <div class="citypanel" id="citypanel" hidden>
        <div class="cp-head"><b id="cp-name"></b><button type="button" id="cp-close" class="linkbtn">Show all of India</button></div>
        <div id="cp-list" class="cp-list"></div>
      </div>
    </div>
    <div class="lists">${group("GMS")}<div class="pair">${group("GSE")}${group("GMA")}</div></div>
  </section><div style="height:40px"></div>`;

  const svg = document.getElementById("india");
  mapView = FULL_VIEW.slice();
  const panel = document.getElementById("citypanel");
  const choose = id => {
    const city = CITIES.find(c => c.id === id);
    svg.querySelectorAll(".pin").forEach(p => p.classList.toggle("on", p.dataset.city === id));
    svg.classList.toggle("focus", !!city);
    document.querySelectorAll(".lists .card").forEach(el => el.classList.toggle("dim", !!city && !city.slugs.includes(el.dataset.slug)));
    if (!city) { panel.hidden = true; setView(svg, FULL_VIEW); return; }
    const [x, y] = INDIA.pins[city.pin], w = 380, h = w * FULL_VIEW[3] / FULL_VIEW[2];
    setView(svg, [x - w / 2, y - h * 0.32, w, h]);
    document.getElementById("cp-name").textContent = city.name;
    document.getElementById("cp-list").innerHTML = city.slugs.map(s => bySlug[s]).filter(Boolean).map(c =>
      `<a class="cp-item" data-brand="${c.brand}" href="#${c.slug}"><span><b>${esc(c.short)}</b><small>${esc(c.board || "")}${c.grades ? " · " + esc(c.grades) : ""}</small></span><span aria-hidden="true">→</span></a>`).join("");
    panel.hidden = false;
  };
  svg.querySelectorAll(".pin").forEach(p => {
    p.addEventListener("click", () => choose(p.classList.contains("on") ? null : p.dataset.city));
    p.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); p.dispatchEvent(new Event("click")); } });
  });
  document.getElementById("cp-close").addEventListener("click", () => choose(null));
  document.querySelectorAll(".lists .card").forEach(el => {
    const city = CITIES.find(c => c.slugs.includes(el.dataset.slug));
    el.addEventListener("mouseenter", () => svg.querySelector(`.pin[data-city="${city.id}"]`)?.classList.add("hover"));
    el.addEventListener("mouseleave", () => svg.querySelector(`.pin[data-city="${city.id}"]`)?.classList.remove("hover"));
  });
}

      <h2>Fees</h2>
      ${tbl(["Grade", "Max students per class", "Student–teacher ratio", "School timings", "Application fee", "Admission fee", "Annual tuition (₹)", ...extras.map(f => esc(f.key)), "Total*"], feeRows, "fees" + (c.feeRows.length > 18 ? " xdense" : c.feeRows.length > 13 ? " dense" : ""))}
      <p class="note">* Total = application fee + admission fee + annual tuition${inTotal.length ? " + " + inTotal.join(" + ") + " (upper figure)" : ""}. ${exams.length ? exams.join(" and ") + " examination fees are extra." : ""} Transport is extra. Fees may change; check the latest fee circular before quoting.</p>
    </div>
    ${alert("printonly")}

    <div class="row2 page2">
      <div class="sec">
        <h2>Transport</h2>
        ${tbl(["Distance from school", "Annual fee (₹)"], c.transport.map(([k, v]) => `<tr><th>${esc(k)}</th><td class="r">${money(v)}</td></tr>`).join(""), "kv")}
      </div>
      <div class="sec">
        <h2>School bus</h2>
        ${tbl(["Feature", "Details"], c.bus.map(([k, v]) => `<tr><th>${esc(k)}</th><td>${esc(blank(v))}</td></tr>`).join(""), "kv")}
      </div>
    </div>

    <div class="sec">
      <h2>Facilities at ${esc(c.short)}</h2>
      ${tbl(["Area", "Facilities"], c.facilities.map(([area, items]) => `<tr><th>${esc(area)}</th><td>${items.map(i => `<span class="chip">${esc(i)}</span>`).join("")}</td></tr>`).join(""), "fac")}
    </div>

    ${c.curriculum ? `<div class="row2">${[c.curriculum.icse, c.curriculum.igcse].map(cu => `<div class="sec"><h2>${esc(cu.title)}</h2>
        ${tbl(["Group", "Type", "Subjects"], cu.groups.map(([g, k, s]) => `<tr><td>${esc(g)}</td><td>${esc(k)}</td><td>${esc(s)}</td></tr>`).join(""), "cur")}
        <p class="note">${esc(cu.note)}</p></div>`).join("")}</div>` : ""}

    ${alert("noprint")}
    <p class="foot">${esc(c.short)} · Campus Fact File · For GEMS admissions teams · Updated ${esc(c.updated)}</p>
  </div></section>`;
}

function route() {
  const slug = location.hash.slice(1);
  const c = CAMPUSES.find(x => x.slug === slug && x.live);
  c ? campus(c) : home();
  window.scrollTo(0, 0);
}
addEventListener("hashchange", route);
route();
</script>
</body>
</html>
